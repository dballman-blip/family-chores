<style>

/* ---------- derived ---------- */
const members = () => S.fam?.members || [];
const kids = () => members().filter(m => m.role === 'kid');
const M = id => members().find(m => m.id === id);
const isParent = () => M(S.me)?.role === 'parent';
const dogName = () => (S.fam?.dogName || '').trim() || 'the dog';
const T = x => String(x.title || '').replace('{dog}', dogName());
const kname = id => { const m = M(id); return m ? (m.nick || m.name) : id; };
function choresFor(kid, k) {
  return (S.fam?.chores || []).filter(c => (c.days || ALL).includes(dow(k)) && (c.kids || []).includes(kid) &&
    (c.rotate === 'alternate' ? c.kids[((dayNum(k) % c.kids.length) + c.kids.length) % c.kids.length] === kid : true));
}
const doneMap = (kid, k) => S.days[k]?.done?.[kid] || {};
function isComplete(kid, k) {
  if (k === S.today) { const l = choresFor(kid, k), d = doneMap(kid, k); return l.length > 0 && l.every(c => d[c.id]); }
  return !!S.days[k]?.complete?.[kid];
}
const isPaused = (kid, k) => (S.fam?.pauses?.[kid] || []).some(p => p.from <= k && (!p.to || k <= p.to));
const pausedNow = kid => isPaused(kid, S.today);
function streak(kid) {
  let s = isComplete(kid, S.today) ? 1 : 0; const start = S.fam?.created || S.today;
  for (let i = 1; i < 400; i++) { const k = addDays(S.today, -i); if (k < start) break;
    if (S.days[k]?.complete?.[kid]) { s++; continue; }
    if (isPaused(kid, k)) continue;
    if (choresFor(kid, k).length === 0) continue;
    break; }
  return s;
}
const best = kid => Math.max(S.fam?.bests?.[kid] || 0, streak(kid));
const earned = kid => S.claims.filter(c => c.kid === kid && c.status === 'approved').reduce((a, c) => a + (+c.pts || 0), 0);
const spent = kid => S.reds.filter(r => r.kid === kid && (r.status === 'approved' || r.status === 'pending')).reduce((a, r) => a + (+r.cost || 0), 0);
const balance = kid => earned(kid) - spent(kid);
function goalProgress() {
  const g = S.fam?.goal; if (!g) return 0; const since = g.since || '0';
  let p = S.claims.filter(c => c.status === 'approved' && (c.day || '') >= since).reduce((a, c) => a + (+c.pts || 0), 0);
  for (const k in S.days) if (k >= since) for (const kid of kids()) if (isComplete(kid.id, k)) p += 2;
  return p;
}
const pendingCount = () => S.claims.filter(c => c.status === 'pending').length + S.reds.filter(r => r.status === 'pending').length + S.sugg.filter(s => s.status === 'pending').length;

/* ---------- sync / subscriptions ---------- */
function subscribe() {
  S.unsub.forEach(u => u && u()); S.unsub = []; S.fam = null; S.famLoaded = false; S.days = {}; S.claims = []; S.reds = []; S.sugg = [];
  if (!S.fid) return;
  S.me = localStorage.getItem('fc.me.' + S.fid);
  S.unsub.push(store.watchDoc(famPath(), d => { S.fam = d; S.famLoaded = true; render(); }));
  S.unsub.push(store.watchCol(sub('days'), arr => { S.days = {}; arr.forEach(d => S.days[d.id] = d); render(); }, ['d', addDays(S.today, -120)]));
  S.unsub.push(store.watchCol(sub('claims'), a => { S.claims = a.sort((x, y) => (y.ts || 0) - (x.ts || 0)); render(); }));
  S.unsub.push(store.watchCol(sub('redemptions'), a => { S.reds = a.sort((x, y) => (y.ts || 0) - (x.ts || 0)); render(); }));
  S.unsub.push(store.watchCol(sub('suggestions'), a => { S.sugg = a.sort((x, y) => (y.ts || 0) - (x.ts || 0)); render(); }));
}

/* ---------- sound + confetti (AudioContext created on first tap for iOS) ---------- */
let AC;
function ac() { if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; AC = new C(); } if (AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, t0, d, type = 'triangle', v = .16) { const a = ac(); if (!a) return; const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0; o.type = type; o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .05); }
function sfx(k) { if (localStorage.getItem('fc.mute') === '1') return; if (k === 'pop') { tone(660, 0, .12); tone(990, .06, .14); } else if (k === 'yay') { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * .11, .35)); tone(1568, .62, .7, 'sine', .1); } }
function confetti() {
  const c = $('#fx'), x = c.getContext('2d'), dpr = devicePixelRatio || 1; c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  const cols = ['#f97316', '#ec4899', '#8b5cf6', '#22c55e', '#eab308', '#0ea5e9'];
  const P = Array.from({length: 170}, () => ({x: Math.random() * c.width, y: -Math.random() * c.height * .5, vx: (Math.random() - .5) * 4 * dpr, vy: (2 + Math.random() * 4) * dpr, r: Math.random() * 6, w: (6 + Math.random() * 6) * dpr, h: (8 + Math.random() * 8) * dpr, c: cols[Math.random() * cols.length | 0], s: Math.random() * .3}));
  const t0 = performance.now();

    for (const p of P) { p.x += p.vx; p.y += p.vy; p.vy += .05 * dpr; p.r += p.s; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.globalAlpha = Math.max(0, 1 - el / 3500); x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore(); }

/* ---------- photo compression (keeps proof under ~200KB) ---------- */
async function compress(file) {
  const url = URL.createObjectURL(file);
  try { const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    let max = 800, q = .7;
    for (let t = 0; t < 7; t++) { const sc = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc)); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); const d = c.toDataURL('image/jpeg', q); if (d.length <= 200000) return d; max *= .75; q = Math.max(.4, q - .1); }
    return null; } catch { return null; } finally { URL.revokeObjectURL(url); }
}

  delChore(el) { if (!confirm('Delete this chore?')) return; W(famPath(), {chores: S.fam.chores.filter(c => c.id !== el.dataset.id)}); closeModal(); },
  editItem(el) { const kind = el.dataset.kind, x = S.fam[kind].find(i => i.id === el.dataset.id) || {id: '', title: '', emoji: kind === 'extras' ? '⭐' : '🎁', [kind === 'extras' ? 'pts' : 'cost']: kind === 'extras' ? 5 : 30}, nk = kind === 'extras' ? 'pts' : 'cost';
    openModal(`<h2>${x.id ? 'Edit' : 'New'} ${kind === 'extras' ? 'extra' : 'reward'}</h2><label class="f">Name</label><input id="iT" value="${esc(x.title)}"><label class="f">Emoji</label><input id="iE" value="${esc(x.emoji)}" maxlength="4"><label class="f">${kind === 'extras' ? 'Points earned' : 'Points cost'}</label><input id="iN" inputmode="numeric" value="${x[nk]}">${kind === 'extras' ? `<label class="f" style="display:flex;align-items:center;gap:8px;font-weight:600"><input type="checkbox" id="iNote" ${x.needsNote ? 'checked' : ''} style="width:auto"> Ask the kid to describe what they did</label>` : ''}<div style="height:14px"></div><button class="big" data-act="saveItem" data-kind="${kind}" data-id="${x.id}">Save</button>${x.id ? `<div style="height:8px"></div><button class="danger" data-act="delItem" data-kind="${kind}" data-id="${x.id}">Delete</button>` : ''}`); },
  saveItem(el) { const kind = el.dataset.kind, nk = kind === 'extras' ? 'pts' : 'cost', t = val('iT'); if (!t) return toast('Give it a name');
    const it = {id: el.dataset.id || rid(), title: t.slice(0, 60), emoji: val('iE') || '⭐', [nk]: Math.max(1, Math.min(1000, parseInt(val('iN')) || 5))};
    if (kind === 'extras' && $('#iNote')?.checked) { it.needsNote = true; it.notePrompt = (S.fam.extras.find(x => x.id === it.id) || {}).notePrompt || 'What did you do? Describe it for your parents.'; }
    const arr = clone(S.fam[kind]); const i = arr.findIndex(x => x.id === it.id); if (i >= 0) arr[i] = it; else arr.push(it); W(famPath(), {[kind]: arr}); closeModal(); },
  delItem(el) { if (!confirm('Delete?')) return; const k = el.dataset.kind; W(famPath(), {[k]: S.fam[k].filter(x => x.id !== el.dataset.id)}); closeModal(); },
  saveFam() { const p = val('mPin'); if (p && !okPin(p)) return toast('PIN must be 4 digits');
    W(famPath(), {name: val('mName') || S.fam.name, dogName: val('mDog'), goal: {...S.fam.goal, title: val('mGoal') || 'Family outing', target: Math.max(10, parseInt(val('mTarget')) || 300)}, ...(p ? {parentPin: pinHash(S.fid, p)} : {})}); toast('Saved'); },
  resetGoal() { if (confirm('Start the team goal from zero today?')) W(famPath(), {goal: {...S.fam.goal, since: S.today}}); },
  async share() { const l = joinLink(); if (navigator.share) { try { await navigator.share({title: 'Family Chores', text: 'Join our family chore board', url: l}); } catch {} } else ACT.copy(); },
  async copy() { try { await navigator.clipboard.writeText(joinLink()); toast('Link copied'); } catch { toast('Copy failed, press and hold the link'); } },
  async qr() { openModal(`<h2>📷 Scan to join</h2><div class="qr" id="qrBox"><p class="mut">Loading…</p></div><button data-act="close">Close</button>`);
    try { if (!window.qrcode) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
      const q = qrcode(0, 'M'); q.addData(joinLink()); q.make(); $('#qrBox').innerHTML = q.createSvgTag({cellSize: 4, margin: 2, scalable: true}); }
    catch { $('#qrBox').innerHTML = '<p class="mut">QR needs internet. Use Share link instead.</p>'; } },
  leave() { if (!confirm('Remove this family from this phone? (Nothing is deleted for the others.)')) return; localStorage.removeItem('fc.fid'); localStorage.removeItem('fc.me.' + S.fid); S.fid = null; subscribe(); render(); }
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); } });

/* ---------- boot ---------- */
(async function boot() {
  render();
  const jf = qs.get('family');
  if (jf && /^[A-Za-z0-9]{20,64}$/.test(jf)) { S.fid = jf; localStorage.setItem('fc.fid', jf); qs.delete('family'); history.replaceState(null, '', location.pathname + (qs.toString() ? '?' + qs : '')); }
  try { await store.init(); } catch (e) { S.ready = true; $('#app').innerHTML = `<main style="text-align:center;margin-top:30vh"><p>Couldn't connect to sync.<br><span class="mut">${esc(e.message || e)}</span></p><button onclick="location.reload()">Try again</button></main>`; return; }
  S.ready = true; subscribe(); render();
  setInterval(tick, 30000); document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body></html>
